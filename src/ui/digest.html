<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>memoir · digest</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f4f4f6;
  color: #1a1a1a;
  min-height: 100vh;
}

header {
  background: #fff;
  border-bottom: 1px solid #e2e2e6;
  padding: 0.875rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.25rem;
  position: sticky;
  top: 0;
  z-index: 10;
}

header h1 { flex-shrink: 0; line-height: 0; }
header h1 a { display: block; }
.app-icon { height: 28px; width: auto; border-radius: 6px; }
.header-nav { font-size: 0.82rem; color: #aaa; flex-shrink: 0; }
.header-nav a { color: #5b8af4; text-decoration: none; }
.header-nav a:hover { text-decoration: underline; }
.header-nav-current { color: #555; font-weight: 500; }

main {
  max-width: 800px;
  margin: 2rem auto;
  padding: 0 1.5rem 4rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e2e2e6;
  padding: 1.25rem 1.5rem;
}

.card-title {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 1rem;
}

.controls {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.range-btn {
  padding: 0.35rem 0.9rem;
  border-radius: 999px;
  border: 1px solid #d0d0d8;
  background: #fff;
  font-size: 0.8rem;
  font-weight: 500;
  color: #555;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.range-btn:hover { background: #f0f0f4; }
.range-btn.active { background: #e8f0ff; border-color: #5b8af4; color: #2a5ad4; font-weight: 600; }

.btn-generate {
  padding: 0.4rem 1.1rem;
  border-radius: 8px;
  border: none;
  background: #0ea5a5;
  color: #fff;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s;
}
.btn-generate:hover:not(:disabled) { background: #0c9090; }
.btn-generate:disabled { opacity: 0.55; cursor: default; }

.progress {
  margin-top: 1rem;
  font-size: 0.85rem;
  color: #888;
  display: none;
}

.result {
  margin-top: 1rem;
}
.result p { margin: 0 0 0.5rem; }
.result p:last-child { margin-bottom: 0; }
.result ul, .result ol { padding-left: 1.25rem; margin: 0 0 0.5rem; }
.result li { margin-bottom: 0.2rem; }
.result h1, .result h2, .result h3 { font-size: 1rem; font-weight: 600; margin: 0.75rem 0 0.25rem; }
.result code { font-family: ui-monospace, monospace; font-size: 0.85em; background: #f0f0f4; padding: 0.1em 0.35em; border-radius: 3px; }
.result pre { background: #f0f0f4; padding: 0.75rem; border-radius: 6px; overflow-x: auto; margin: 0 0 0.5rem; }
.result pre code { background: none; padding: 0; }
.result a { color: #0ea5a5; }
.result strong { font-weight: 600; }

.history-list {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.history-item {
  border: 1px solid #e2e2e6;
  border-bottom: none;
  background: #fff;
  padding: 0.75rem 1rem;
}
.history-item:first-child { border-radius: 10px 10px 0 0; }
.history-item:last-child { border-bottom: 1px solid #e2e2e6; border-radius: 0 0 10px 10px; }
.history-item:only-child { border-radius: 10px; border-bottom: 1px solid #e2e2e6; }

.history-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  cursor: pointer;
  user-select: none;
}
.history-header:hover .history-title { text-decoration: underline; }

.history-title {
  font-size: 0.875rem;
  font-weight: 500;
  color: #333;
  flex: 1;
}

.history-meta {
  font-size: 0.75rem;
  color: #aaa;
}

.history-status {
  font-size: 0.7rem;
  font-weight: 600;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
}
.history-status-done { background: #dcfce7; color: #166534; }
.history-status-running { background: #dbeafe; color: #1e40af; }
.history-status-error { background: #fee2e2; color: #991b1b; }

.history-toggle {
  font-size: 0.72rem;
  color: #bbb;
  transition: transform 0.15s;
}

.history-body {
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid #f0f0f4;
  font-size: 0.875rem;
  display: none;
}
.history-item.expanded .history-body { display: block; }
.history-item.expanded .history-toggle { transform: rotate(180deg); }

.empty { color: #aaa; font-size: 0.875rem; }
</style>

<main>
  <div class="card">
    <div class="card-title">Generate Digest</div>
    <div class="controls">
      <button class="range-btn active" data-hours="24" onclick="setRange(this)">24h</button>
      <button class="range-btn" data-hours="72" onclick="setRange(this)">3d</button>
      <button class="range-btn" data-hours="168" onclick="setRange(this)">7d</button>
      <button class="btn-generate" id="btn-generate" onclick="generate()">Generate</button>
    </div>
    <div class="progress" id="progress"></div>
    <div class="result" id="result"></div>
  </div>

  <div class="card" id="history-card" style="display:none">
    <div class="card-title">Past Digests</div>
    <div class="history-list" id="history-list"></div>
  </div>
</main>

<script>
let _hours = 24;
let _pollTimer = null;

function setRange(btn) {
  document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  _hours = parseInt(btn.dataset.hours, 10);
}

function hoursLabel(h) {
  if (h === 24) return '24 hours';
  if (h === 72) return '3 days';
  if (h === 168) return '7 days';
  return h % 24 === 0 ? `${h / 24} days` : `${h} hours`;
}

function fmtDate(s) {
  if (!s) return '';
  try { return new Date(s + 'Z').toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch { return s; }
}

async function generate() {
  clearTimeout(_pollTimer);
  const btn = document.getElementById('btn-generate');
  const progress = document.getElementById('progress');
  const result = document.getElementById('result');
  btn.disabled = true;
  progress.style.display = 'block';
  progress.textContent = 'Starting…';
  result.innerHTML = '';

  try {
    const r = await fetch('/api/digest', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ hours: _hours }),
    });
    const data = await r.json();
    if (!r.ok || !data.id) {
      progress.textContent = data.error || 'Server error.';
      btn.disabled = false;
      return;
    }
    poll(data.id, btn, progress, result);
  } catch {
    progress.textContent = 'Could not reach server.';
    btn.disabled = false;
  }
}

function poll(id, btn, progress, result) {
  _pollTimer = setTimeout(async () => {
    try {
      const r = await fetch(`/api/digest/status/${id}`);
      const job = await r.json();
      if (job.status === 'running') {
        progress.textContent = job.progress || 'Working…';
        poll(id, btn, progress, result);
      } else if (job.status === 'done') {
        progress.style.display = 'none';
        result.innerHTML = job.result_html || '';
        btn.disabled = false;
        loadHistory();
      } else {
        progress.textContent = 'Error: ' + (job.progress || 'unknown error');
        btn.disabled = false;
        loadHistory();
      }
    } catch {
      progress.textContent = 'Polling failed.';
      btn.disabled = false;
    }
  }, 2000);
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function loadHistory() {
  try {
    const r = await fetch('/api/digest/history');
    const jobs = await r.json();
    const card = document.getElementById('history-card');
    const list = document.getElementById('history-list');
    if (!jobs.length) { card.style.display = 'none'; return; }
    card.style.display = '';
    list.innerHTML = jobs.map(j => {
      const statusClass = `history-status-${j.status}`;
      const label = hoursLabel(j.hours);
      const ts = fmtDate(j.created_at);
      const duration = j.finished_at
        ? (() => { try { const ms = new Date(j.finished_at + 'Z') - new Date(j.created_at + 'Z'); return `${Math.round(ms / 1000)}s`; } catch { return ''; } })()
        : '';
      return `<div class="history-item" data-id="${j.id}">
        <div class="history-header" onclick="toggleHistory(this.closest('.history-item'))">
          <span class="history-status ${statusClass}">${j.status}</span>
          <span class="history-title">Last ${label}</span>
          <span class="history-meta">${ts}${duration ? ` · ${duration}` : ''}</span>
          <span class="history-toggle">▾</span>
        </div>
        <div class="history-body result"></div>
      </div>`;
    }).join('');
  } catch {}
}

async function toggleHistory(item) {
  const isOpen = item.classList.contains('expanded');
  if (isOpen) { item.classList.remove('expanded'); return; }
  const body = item.querySelector('.history-body');
  if (!body.dataset.loaded) {
    body.innerHTML = '<span class="empty">Loading…</span>';
    item.classList.add('expanded');
    try {
      const r = await fetch(`/api/digest/status/${item.dataset.id}`);
      const job = await r.json();
      body.innerHTML = job.result_html || `<span class="empty">${esc(job.progress || 'No result yet.')}</span>`;
      body.dataset.loaded = '1';
    } catch {
      body.innerHTML = '<span class="empty">Failed to load.</span>';
    }
  } else {
    item.classList.add('expanded');
  }
}

loadHistory();
</script>
